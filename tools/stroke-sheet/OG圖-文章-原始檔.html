<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#FAF7F1;font-family:"Noto Sans TC","PingFang TC",sans-serif;
       color:#29302F;position:relative}

  .rule{position:absolute;top:0;left:0;right:0;height:9px;display:flex}
  .rule i{display:block;height:100%}
  .rule i:nth-child(1){background:#1A5C5A;flex:6}
  .rule i:nth-child(2){background:#E8735A;flex:2}
  .rule i:nth-child(3){background:#D4A843;flex:1}

  .pad{position:absolute;inset:9px 0 0 0;padding:48px 68px 42px;padding-right:452px;
       display:flex;flex-direction:column}

  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:18px;letter-spacing:.2em;
           text-transform:uppercase;color:#8B8F8C}
  .eyebrow b{color:#1A5C5A;font-weight:500}

  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:62px;line-height:1.16;
     letter-spacing:.01em;color:#16302F;margin-top:18px;white-space:nowrap}
  .bar{width:72px;height:7px;background:#E8735A;border-radius:4px;margin:20px 0 0}

  .lead{margin-top:20px;font-size:25px;line-height:1.55;color:#3E4643;font-weight:500}
  .lead b{color:#1A5C5A;font-weight:700}

  /* 文章的那句話，取代工具版的層級晶片 */
  .quote{margin-top:auto;border-left:4px solid #1A5C5A;background:#E7EFEE;
         padding:15px 20px;max-width:600px;font-size:20px;line-height:1.6;color:#1A5C5A;
         font-weight:500}

  .foot{display:flex;align-items:baseline;gap:13px;margin-top:22px;
        border-top:1px solid #E8E1D6;padding-top:17px}
  .brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:23px;color:#1A5C5A}
  .dom{font-family:"IBM Plex Mono",monospace;font-size:18px;color:#8B8F8C;letter-spacing:.03em}

  /* 右側：單張的抬頭。刻意只取到填名字那一段，因為文章講的就是這件事 */
  .paper{position:absolute;right:64px;top:74px;width:340px;height:452px;background:#fff;
         border:1px solid #E8E1D6;border-radius:12px;
         box-shadow:0 18px 40px rgba(26,92,90,.14);
         padding:21px 21px 20px;display:flex;flex-direction:column;overflow:hidden}
  .paper .ttl{font-family:"Noto Serif TC",serif;font-weight:700;font-size:21px;color:#16302F}
  .paper .who{font-size:12.5px;color:#1A5C5A;font-weight:700;letter-spacing:.05em;margin-top:6px}
  .paper .hdrule{height:2px;background:#16302F;margin-top:10px}

  .fields{margin-top:14px;display:flex;flex-direction:column;gap:11px;font-size:13px;color:#8B8F8C}
  .fields div{display:flex;align-items:baseline;gap:9px}
  .fields i{font-style:normal;flex:1;border-bottom:1px solid #D9D3C7;height:1.35em}
  .fields .side{color:#16302F;font-weight:700;font-size:14px}
  .fields .filled{flex:none;border:0;color:#29302F;font-weight:700;font-size:13.5px;height:auto}

  .sect{font-size:13px;color:#8B8F8C;margin-top:18px}
  .item{display:flex;gap:9px;margin-top:11px}
  .item .no{flex:0 0 22px;height:22px;border-radius:50%;background:#1A5C5A;color:#fff;
            font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;
            display:flex;align-items:center;justify-content:center}
  .item .n{font-size:15px;font-weight:700;color:#29302F;line-height:1.35}
  .item .dose{display:inline-block;margin-top:6px;background:#E7EFEE;border-radius:5px;
              padding:5px 9px;font-size:12.5px;font-weight:700;color:#1A5C5A}

  .no-box{margin-top:auto;border:1.5px solid #A62B2B;border-radius:8px;overflow:hidden}
  .no-box h4{font-size:13px;font-weight:700;color:#A62B2B;padding:7px 11px;
             border-bottom:1px solid #A62B2B}
  .no-box p{font-size:12.5px;line-height:1.6;color:#3E4643;padding:9px 11px}
  .no-box p b{color:#A62B2B}
</style>
</head>
<body>

<div class="rule"><i></i><i></i><i></i></div>

<div class="paper">
  <div class="ttl">從室內走到走出門</div>
  <div class="who">這張給你自己看</div>
  <div class="hdrule"></div>

  <div class="fields">
    <div><span>姓名</span><i></i></div>
    <div><span class="side">受影響的是：左邊</span></div>
    <div><span>開始日期</span><i></i></div>
    <div><span>醫師／治療師</span><i class="filled">吳俊諺</i></div>
  </div>

  <div class="sect">每天要練的三件事</div>
  <div class="item"><span class="no">1</span><div>
    <div class="n">每天走路</div><span class="dose">3–4 趟 ・ 一週大多數天</span>
  </div></div>

  <div class="no-box">
    <h4>這些事請不要做</h4>
    <p><b>不要為了走快而拖著左腳走。</b></p>
  </div>
</div>

<div class="pad">
  <p class="eyebrow">醫療現場 &nbsp;·&nbsp; <b>中風復健</b></p>

  <h1>這一張，<br>是為他寫的</h1>
  <div class="bar"></div>

  <p class="lead">通用的衛教單張其實都沒有錯，<br>只是<b>它不是為眼前這個人寫的</b></p>

  <p class="quote">填上名字的那一刻，<br>它就不再是一張傳單，而是一份交代。</p>

  <div class="foot">
    <span class="brand">吳俊諺</span>
    <span class="dom">chunyenwu.net</span>
  </div>
</div>

</body>
</html>
