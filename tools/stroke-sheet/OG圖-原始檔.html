<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=block">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#FAF7F1;
    font-family:"Noto Sans TC","PingFang TC",sans-serif;
    color:#29302F;
    position:relative;
  }
  /* 品牌三色頂條（與 chunyenwu.net 同一套） */
  .rule{position:absolute;top:0;left:0;right:0;height:9px;display:flex}
  .rule i{display:block;height:100%}
  .rule i:nth-child(1){background:#1A5C5A;flex:6}
  .rule i:nth-child(2){background:#E8735A;flex:2}
  .rule i:nth-child(3){background:#D4A843;flex:1}

  .pad{position:absolute;inset:9px 0 0 0;padding:48px 68px 42px;padding-right:452px;
       display:flex;flex-direction:column}

  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#8B8F8C;
  }
  .eyebrow b{color:#1A5C5A;font-weight:500}

  h1{
    font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:62px;line-height:1.16;letter-spacing:.01em;
    color:#16302F;margin-top:18px;white-space:nowrap;
  }
  .bar{width:72px;height:7px;background:#E8735A;border-radius:4px;margin:20px 0 0}

  .lead{margin-top:20px;font-size:25px;line-height:1.55;color:#3E4643;font-weight:500}
  .lead b{color:#1A5C5A;font-weight:700}
  .sub{margin-top:11px;font-size:19px;line-height:1.5;color:#8B8F8C;font-weight:400}

  /* 寬度刻意收到 480，讓七個晶片斷成 4＋3——正好是下肢四級與上肢三級 */
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;max-width:480px}
  .chip{
    font-size:17px;line-height:1;padding:10px 13px;border-radius:999px;
    background:#E7EFEE;color:#1A5C5A;font-weight:500;white-space:nowrap;
  }
  .chip.hot{background:#1A5C5A;color:#FAF7F1}

  .foot{
    display:flex;align-items:baseline;gap:13px;margin-top:22px;
    border-top:1px solid #E8E1D6;padding-top:17px;
  }
  .brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:23px;color:#1A5C5A}
  .dom{font-family:"IBM Plex Mono",monospace;font-size:18px;color:#8B8F8C;letter-spacing:.03em}

  /* 右側：一張印出來的單張的局部。這套單張目前全是文字，
     所以縮圖就老實呈現文字的樣子——編號、劑量、紅框。 */
  .paper{
    position:absolute;right:64px;top:74px;width:340px;height:452px;
    background:#fff;border:1px solid #E8E1D6;border-radius:12px;
    box-shadow:0 18px 40px rgba(26,92,90,.14);
    padding:19px 19px 20px;display:flex;flex-direction:column;overflow:hidden;
  }
  .paper .ttl{
    font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:20px;color:#16302F;letter-spacing:.01em;
  }
  .paper .who{font-size:12.5px;color:#1A5C5A;font-weight:700;letter-spacing:.05em;margin-top:5px}
  .paper .hdrule{height:2px;background:#16302F;margin-top:9px}
  .paper .sect{font-size:13px;color:#8B8F8C;margin-top:13px}

  .item{display:flex;gap:9px;margin-top:11px}
  .item .no{
    flex:0 0 22px;height:22px;border-radius:50%;background:#1A5C5A;color:#fff;
    font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .item .n{font-size:15px;font-weight:700;color:#29302F;line-height:1.35}
  .item .dose{
    display:inline-block;margin-top:6px;background:#E7EFEE;border-radius:5px;
    padding:5px 9px;font-size:12.5px;font-weight:700;color:#1A5C5A;
  }

  .no-box{margin-top:auto;border:1.5px solid #A62B2B;border-radius:8px;overflow:hidden}
  .no-box h4{
    font-size:13px;font-weight:700;color:#A62B2B;padding:7px 11px;
    border-bottom:1px solid #A62B2B;
  }
  .no-box p{font-size:12.5px;line-height:1.6;color:#3E4643;padding:9px 11px}
  .no-box p b{color:#A62B2B}
</style>
</head>
<body>

<div class="rule"><i></i><i></i><i></i></div>

<div class="paper">
  <div class="ttl">從室內走到走出門</div>
  <div class="who">這張給你自己看</div>
  <div class="hdrule"></div>
  <div class="sect">每天要練的三件事</div>

  <div class="item"><span class="no">1</span><div>
    <div class="n">每天走路</div><span class="dose">3–4 趟 ・ 一週大多數天</span>
  </div></div>
  <div class="item"><span class="no">2</span><div>
    <div class="n">坐到站，不用手撐</div><span class="dose">8–10 下 ・ 一天 2–3 輪</span>
  </div></div>
  <div class="item"><span class="no">3</span><div>
    <div class="n">站著練平衡</div><span class="dose">10 秒 × 3 次 ・ 一週 3 天</span>
  </div></div>

  <div class="no-box">
    <h4>這些事請不要做</h4>
    <p><b>不要穿拖鞋</b>、後跟沒包住或太鬆的鞋。<br><b>不要為了走快而拖著左腳走。</b></p>
  </div>
</div>

<div class="pad">
  <p class="eyebrow">門診工具 &nbsp;·&nbsp; <b>中風復健</b></p>

  <h1>中風居家<br>單張產生器</h1>
  <div class="bar"></div>

  <p class="lead">依<b>下肢與上肢功能</b>分層，<br>當場印給病人帶回家</p>
  <p class="sub">照顧者版與病人版分開寫・患側左右自動帶入</p>

  <div class="chips">
    <span class="chip hot">還站不起來</span>
    <span class="chip">能扶著站</span>
    <span class="chip">室內能走</span>
    <span class="chip">能出門</span>
    <span class="chip">手不能動</span>
    <span class="chip">肩肘能動</span>
    <span class="chip">抓得住</span>
  </div>

  <div class="foot">
    <span class="brand">吳俊諺</span>
    <span class="dom">chunyenwu.net/stroke-sheet</span>
  </div>
</div>

</body>
</html>
